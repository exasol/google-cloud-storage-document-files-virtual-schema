sources:
  - type: maven
    path: pom.xml
    modules:
      - integration_tests
      - jar_artifact
      - udf_coverage
linkReplacements:
build:
  runnerOs: ubuntu-24.04
  freeDiskSpace: true
  exasolDbVersions:
    - "2026.1.0" # Latest version
    - "2025.1.13" # Latest LTS version
    - "8.29.13" # Latest v8 LTS version
  workflows:
    - name: ci-build.yml
      stepCustomizations:
        - action: INSERT_AFTER
          job: matrix-build
          stepId: enable-testcontainer-reuse
          content:
            name: Configure Google credentials
            id: configure-google-credentials
            run: echo "$GC_KEY" > google-key.json
            env:
              GC_KEY: ${{ secrets.GC_KEY }}

        - action: INSERT_AFTER
          job: matrix-build
          stepId: enable-testcontainer-reuse
          content:
            name: Fix VM Crash in UDFs
            id: fix-vm-crash
            run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
